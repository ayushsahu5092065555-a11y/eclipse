<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Eclipse // Official Community</title>
  <meta name="description" content="Eclipse // Gaming Community • Active Chat • Gaming Squads • Midnight Shayari">
  <meta name="theme-color" content="#05030a">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #05030a;
      --bg2: #090510;
      --pink: #ff2a85;
      --pink-soft: #ff9dca;
      --purple: #8a2be2;
      --blue: #5865f2;
      --cyan: #00eaff;
      --white: #ffffff;
      --muted: #a99bb9;
      --green: #23a55a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 10%, rgba(138,43,226,.14), transparent 30%),
        radial-gradient(circle at 10% 60%, rgba(255,42,133,.07), transparent 25%),
        var(--bg);
      color: var(--white);
      font-family: "Plus Jakarta Sans", sans-serif;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       BACKGROUND PARTICLES
    ========================== */

    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .petal {
      position: absolute;
      top: -30px;
      width: 10px;
      height: 16px;
      border-radius: 80% 10% 80% 10%;
      background: linear-gradient(
        135deg,
        rgba(255,180,215,.9),
        rgba(255,42,133,.25)
      );
      filter: drop-shadow(0 0 8px rgba(255,42,133,.8));
      animation: fall linear infinite;
    }

    .petal:nth-child(1) {
      left: 8%;
      animation-duration: 10s;
    }

    .petal:nth-child(2) {
      left: 27%;
      animation-duration: 13s;
      animation-delay: 3s;
      transform: scale(.7);
    }

    .petal:nth-child(3) {
      left: 51%;
      animation-duration: 9s;
      animation-delay: 2s;
      transform: scale(1.2);
    }

    .petal:nth-child(4) {
      left: 74%;
      animation-duration: 12s;
      animation-delay: 4s;
      transform: scale(.8);
    }

    .petal:nth-child(5) {
      left: 92%;
      animation-duration: 11s;
      animation-delay: 1s;
    }

    @keyframes fall {
      0% {
        transform: translate(0,-50px) rotate(0);
        opacity: 0;
      }

      15% {
        opacity: .8;
      }

      85% {
        opacity: .7;
      }

      100% {
        transform: translate(100px,110vh) rotate(420deg);
        opacity: 0;
      }
    }

    /* =========================
       MAIN
    ========================== */

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
    }

    /* =========================
       NAVBAR
    ========================== */

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 28px;

      background: rgba(5,3,10,.62);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border-bottom: 1px solid rgba(255,255,255,.07);

      z-index: 100;
    }

    .brand {
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 1px;

      background: linear-gradient(
        100deg,
        #fff,
        #ffb8da,
        #d9a4ff
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-button {
      padding: 10px 18px;
      border-radius: 999px;

      background: linear-gradient(
        135deg,
        var(--blue),
        var(--pink)
      );

      font-size: 11px;
      font-weight: 900;
      letter-spacing: .7px;

      box-shadow:
        0 0 20px rgba(255,42,133,.25);

      transition: .25s ease;
    }

    .nav-button:active {
      transform: scale(.95);
    }

    /* =========================
       HERO
    ========================== */

    .hero {
      position: relative;
      width: 100%;
      min-height: 100svh;

      display: flex;
      align-items: flex-end;
      justify-content: center;

      overflow: hidden;
    }

    .hero-banner {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .hero-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;

      filter:
        brightness(.72)
        contrast(1.08)
        saturate(.9);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.45) 0%,
          rgba(5,3,10,.05) 30%,
          rgba(5,3,10,.28) 55%,
          rgba(5,3,10,.98) 100%
        );
    }

    .hero-glow {
      position: absolute;
      width: 500px;
      height: 500px;

      left: 50%;
      bottom: -300px;

      transform: translateX(-50%);

      background: var(--pink);
      filter: blur(180px);
      opacity: .15;
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      z-index: 3;

      width: min(850px, 100%);
      padding:
        90px 20px
        max(55px, env(safe-area-inset-bottom));

      text-align: center;
    }

    .logo-ring {
      width: 108px;
      height: 108px;

      margin: 0 auto 18px;

      padding: 3px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          var(--pink),
          var(--cyan),
          var(--purple)
        );

      box-shadow:
        0 0 30px rgba(255,42,133,.55),
        0 0 70px rgba(138,43,226,.2);

      animation: logoGlow 5s linear infinite;
    }

    .logo-ring img {
      width: 100%;
      height: 100%;

      object-fit: cover;
      border-radius: 50%;

      background: #000;
    }

    @keyframes logoGlow {
      0% {
        filter: hue-rotate(0deg);
      }

      100% {
        filter: hue-rotate(360deg);
      }
    }

    .hero-title {
      font-family: "Playfair Display", serif;
      font-style: italic;

      font-size: clamp(42px, 9vw, 78px);
      line-height: 1;

      font-weight: 900;
      letter-spacing: 2px;

      background:
        linear-gradient(
          110deg,
          #fff,
          #ffb8da 45%,
          #dca8ff
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      margin-bottom: 10px;
    }

    .hero-subtitle {
      color: #d4c8df;
      font-family: "Playfair Display", serif;
      font-style: italic;

      font-size: clamp(13px, 2vw, 16px);
      letter-spacing: 1px;

      margin-bottom: 22px;
    }

    .stats {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;

      padding: 9px 18px;

      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;

      background: rgba(255,255,255,.06);
      backdrop-filter: blur(15px);

      color: #eee;

      font-size: 12px;
      font-weight: 700;

      margin-bottom: 24px;
    }

    .online {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .online-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: var(--green);

      box-shadow:
        0 0 10px var(--green);
    }

    .join-button {
      width: min(540px, 100%);
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;

      padding: 17px 24px;

      border-radius: 17px;

      background:
        linear-gradient(
          100deg,
          var(--blue),
          #8a3ffc,
          var(--pink)
        );

      box-shadow:
        0 15px 45px rgba(88,101,242,.35);

      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;

      transition: .25s ease;
    }

    .join-button:hover {
      transform: translateY(-3px);
      box-shadow:
        0 20px 55px rgba(255,42,133,.35);
    }

    .join-button:active {
      transform: scale(.97);
    }

    .discord-icon {
      width: 24px;
      height: 24px;
      fill: white;
    }

    /* =========================
       SECTIONS
    ========================== */

    .section {
      width: 100%;
      padding: 80px 20px;
      position: relative;
    }

    .section-inner {
      width: min(1100px, 100%);
      margin: auto;
    }

    .section-title {
      text-align: center;

      font-family: "Playfair Display", serif;
      font-style: italic;

      font-size: clamp(28px, 5vw, 42px);

      margin-bottom: 10px;

      background:
        linear-gradient(
          100deg,
          #fff,
          #ffb0d4,
          #d7a4ff
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .section-description {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 35px;
    }

    /* =========================
       GAMING
    ========================== */

    .games {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 16px;
    }

    .game {
      position: relative;
      min-height: 185px;

      overflow: hidden;

      border-radius: 22px;

      border: 1px solid rgba(255,255,255,.09);

      background:
        linear-gradient(
          135deg,
          rgba(25,12,40,.9),
          rgba(8,5,13,.9)
        );

      padding: 20px;

      transition: .3s ease;
    }

    .game::before {
      content: "";
      position: absolute;
      inset: -50%;

      background:
        radial-gradient(
          circle,
          rgba(255,42,133,.14),
          transparent 60%
        );

      opacity: 0;
      transition: .3s ease;
    }

    .game:hover::before {
      opacity: 1;
    }

    .game:hover {
      transform: translateY(-4px);
      border-color: rgba(255,42,133,.3);

      box-shadow:
        0 15px 50px rgba(0,0,0,.35);
    }

    .game-top {
      position: relative;
      z-index: 2;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .game-icon {
      width: 58px;
      height: 58px;

      border-radius: 15px;

      object-fit: cover;

      border: 1px solid rgba(255,255,255,.15);

      box-shadow:
        0 8px 25px rgba(0,0,0,.5);
    }

    .vc-button {
      font-size: 9px;
      font-weight: 900;

      color: var(--cyan);

      border: 1px solid rgba(0,234,255,.3);

      background: rgba(0,234,255,.07);

      padding: 6px 9px;

      border-radius: 999px;
    }

    .game-info {
      position: relative;
      z-index: 2;
      margin-top: 30px;
    }

    .game-name {
      font-family: "Playfair Display", serif;
      font-style: italic;

      font-size: 22px;
      font-weight: 800;

      margin-bottom: 4px;
    }

    .game-sub {
      color: var(--muted);
      font-size: 12px;
    }

    /* =========================
       MEMBERS
    ========================== */

    .members-section {
      padding-top: 55px;
    }

    .member-panel {
      width: 100%;

      border-top: 1px solid rgba(255,255,255,.08);
      border-bottom: 1px solid rgba(255,255,255,.08);

      padding: 30px 0;
    }

    .member-stats {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 25px;
    }

    .member-number {
      font-size: clamp(42px,8vw,65px);
      font-weight: 900;
      line-height: .9;
    }

    .member-label {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .online-text {
      color: #43d17b;
      font-size: 12px;
      font-weight: 800;
    }

    .avatars {
      display: flex;
      gap: 13px;

      overflow-x: auto;
      scrollbar-width: none;

      padding: 5px 2px 10px;
    }

    .avatars::-webkit-scrollbar {
      display: none;
    }

    .avatar {
      flex: 0 0 45px;

      width: 45px;
      height: 45px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 2px solid rgba(255,255,255,.16);

      box-shadow:
        0 5px 15px rgba(0,0,0,.5);

      position: relative;
    }

    .avatar svg {
      width: 23px;
      height: 23px;
      fill: #fff;
    }

    .avatar::after {
      content: "";

      position: absolute;
      right: -1px;
      bottom: 0;

      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: var(--green);

      border: 2px solid var(--bg);
    }

    /* =========================
       OWNER
    ========================== */

    .owner-section {
      background:
        linear-gradient(
          180deg,
          rgba(20,8,32,.4),
          rgba(5,3,10,.9)
        );

      border-top: 1px solid rgba(255,42,133,.12);
    }

    .owner {
      display: grid;
      grid-template-columns: 130px 1fr;
      gap: 28px;
      align-items: center;

      margin-bottom: 60px;
    }

    .owner-avatar {
      width: 125px;
      height: 125px;

      padding: 3px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #ffd700,
          var(--pink)
        );

      box-shadow:
        0 0 35px rgba(255,215,0,.18);
    }

    .owner-avatar img {
      width: 100%;
      height: 100%;

      border-radius: 50%;
      object-fit: cover;

      background: #000;
    }

    .owner-tag {
      display: inline-block;

      padding: 5px 10px;

      border-radius: 6px;

      color: #ffd966;
      background: rgba(255,215,0,.08);
      border: 1px solid rgba(255,215,0,.22);

      font-size: 9px;
      font-weight: 900;

      letter-spacing: 1px;

      margin-bottom: 8px;
    }

    .owner-name {
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .owner-role {
      color: var(--pink-soft);
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-size: 15px;
    }

    .content-block {
      margin-top: 35px;
    }

    .content-heading {
      font-family: "Playfair Display", serif;
      font-style: italic;

      font-size: 26px;
      margin-bottom: 12px;

      color: #fff;
    }

    .content-text {
      color: #cfc2da;
      line-height: 1.8;
      font-size: 14px;
    }

    /* =========================
       RULES
    ========================== */

    .rules {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 10px;
    }

    .rule {
      padding: 15px;

      border-left: 2px solid var(--pink);

      background: rgba(255,255,255,.025);

      color: #d9cde3;

      font-size: 13px;
      line-height: 1.6;
    }

    .rule b {
      color: #fff;
    }

    /* =========================
       FOOTER
    ========================== */

    footer {
      padding: 45px 20px 70px;

      text-align: center;

      border-top: 1px solid rgba(255,255,255,.07);

      color: #746980;

      font-size: 11px;
    }

    footer strong {
      color: #cbb5d8;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 650px) {

      .navbar {
        height: 62px;
        padding: 0 16px;
      }

      .brand {
        font-size: 21px;
      }

      .nav-button {
        font-size: 9px;
        padding: 8px 13px;
      }

      .hero {
        min-height: 100svh;
      }

      .hero-content {
        padding-left: 16px;
        padding-right: 16px;
        padding-bottom: 45px;
      }

      .logo-ring {
        width: 92px;
        height: 92px;
        margin-bottom: 15px;
      }

      .hero-title {
        font-size: 46px;
      }

      .hero-subtitle {
        font-size: 12px;
      }

      .stats {
        font-size: 10px;
        gap: 9px;
        padding: 8px 13px;
      }

      .join-button {
        padding: 15px;
        font-size: 14px;
      }

      .section {
        padding: 60px 14px;
      }

      .games {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .game {
        min-height: 160px;
        padding: 14px;
        border-radius: 17px;
      }

      .game-icon {
        width: 45px;
        height: 45px;
        border-radius: 12px;
      }

      .vc-button {
        font-size: 7px;
        padding: 5px 6px;
      }

      .game-info {
        margin-top: 20px;
      }

      .game-name {
        font-size: 17px;
      }

      .game-sub {
        font-size: 9px;
      }

      .owner {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 15px;
      }

      .owner-avatar {
        margin: auto;
        width: 105px;
        height: 105px;
      }

      .owner-name {
        font-size: 26px;
      }

      .rules {
        grid-template-columns: 1fr;
      }
    }

    /* Extra small phones */

    @media (max-width: 380px) {

      .games {
        grid-template-columns: 1fr;
      }

      .game {
        min-height: 145px;
      }

      .hero-title {
        font-size: 40px;
      }
    }

  </style>
</head>
