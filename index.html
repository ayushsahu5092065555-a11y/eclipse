<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eclipse // Discord Community</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    background:
        radial-gradient(
            circle at 50% 12%,
            rgba(125, 0, 100, .24),
            transparent 35%
        ),
        radial-gradient(
            circle at 10% 60%,
            rgba(95, 0, 100, .16),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(70, 0, 120, .14),
            transparent 35%
        ),
        #050308;

    color: #fff;

    font-family: Inter, sans-serif;
}


/* =========================================================
   FALLING PETALS
========================================================= */

.petal {
    position: fixed;

    width: 5px;
    height: 9px;

    border-radius: 70% 20% 70% 20%;

    background: #ff54d8;

    opacity: .75;

    pointer-events: none;

    z-index: 100;

    animation:
        fall linear infinite,
        petalGlow 2.5s ease-in-out infinite;
}

.petal:nth-child(1) {
    left: 6%;
    animation-duration: 9s;
    animation-delay: -2s;
}

.petal:nth-child(2) {
    left: 18%;
    animation-duration: 12s;
    animation-delay: -5s;
}

.petal:nth-child(3) {
    left: 31%;
    animation-duration: 10s;
    animation-delay: -1s;
}

.petal:nth-child(4) {
    left: 45%;
    animation-duration: 13s;
    animation-delay: -7s;
}

.petal:nth-child(5) {
    left: 58%;
    animation-duration: 9s;
    animation-delay: -4s;
}

.petal:nth-child(6) {
    left: 71%;
    animation-duration: 11s;
    animation-delay: -8s;
}

.petal:nth-child(7) {
    left: 84%;
    animation-duration: 14s;
    animation-delay: -3s;
}

.petal:nth-child(8) {
    left: 94%;
    animation-duration: 10s;
    animation-delay: -6s;
}

@keyframes fall {

    0% {
        transform:
            translateY(-10vh)
            translateX(0)
            rotate(0deg);
    }

    50% {
        transform:
            translateY(50vh)
            translateX(35px)
            rotate(180deg);
    }

    100% {
        transform:
            translateY(110vh)
            translateX(-35px)
            rotate(360deg);
    }
}

@keyframes petalGlow {

    0%,100% {
        box-shadow: 0 0 3px rgba(255,50,210,.2);
        opacity: .35;
    }

    50% {
        box-shadow: 0 0 12px rgba(255,50,210,.8);
        opacity: .9;
    }
}


/* =========================================================
   HEADER
========================================================= */

header {
    position: sticky;
    top: 0;

    width: 100%;

    height: 58px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 20px;

    background:
        rgba(5, 3, 8, .88);

    backdrop-filter: blur(18px);

    border-bottom:
        1px solid rgba(255,255,255,.07);

    z-index: 90;
}

.brand {
    font-family:
        "Playfair Display",
        Georgia,
        serif;

    font-style: italic;

    font-size: 17px;

    color: #f7cce9;

    text-shadow:
        0 0 12px rgba(255,70,210,.4);
}

.header-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    padding: 8px 14px;

    border-radius: 999px;

    text-decoration: none;

    font-size: 9px;
    font-weight: 700;

    color: white;

    background:
        linear-gradient(
            90deg,
            #693fff,
            #ff00bb
        );

    box-shadow:
        0 0 18px rgba(255,0,210,.25);
}


/* =========================================================
   BIG BANNER
========================================================= */

.banner {
    width: 100% !important;

    height: 260px !important;

    position: relative !important;

    overflow: hidden !important;

    margin: 0 !important;
    padding: 0 !important;

    border: 0 !important;

    background: #100512;
}

.banner img {
    width: 100% !important;

    height: 100% !important;

    display: block !important;

    object-fit: cover !important;

    object-position: center center !important;

    margin: 0 !important;
    padding: 0 !important;

    filter:
        brightness(.78)
        saturate(1.15);
}

.banner::after {
    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.05),
            rgba(0,0,0,.20) 45%,
            rgba(5,3,8,.75) 100%
        );

    pointer-events: none;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    position: relative;

    max-width: 850px;

    margin: 0 auto;

    padding:
        0 20px
        40px;

    text-align: center;
}

.logo-wrap {
    position: relative;

    width: 86px;
    height: 86px;

    margin:
        -43px auto
        10px;

    z-index: 10;
}

.logo-wrap::before {
    content: "";

    position: absolute;

    inset: -5px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #ff00d4,
            #7d3cff,
            #ff00d4
        );

    animation: logoSpin 5s linear infinite;

    z-index: -1;
}

@keyframes logoSpin {
    to {
        transform: rotate(360deg);
    }
}

.logo-wrap img {
    width: 100%;
    height: 100%;

    border-radius: 50%;

    object-fit: cover;

    display: block;

    border:
        3px solid #09040c;

    box-shadow:
        0 0 25px rgba(255,0,220,.55);
}

.hero h1 {
    margin-top: 14px;

    font-family:
        "Playfair Display",
        Georgia,
        serif;

    font-size:
        clamp(42px, 10vw, 72px);

    font-style: italic;

    line-height: 1;

    color: #ffe7f6;

    text-shadow:
        0 0 25px rgba(255,60,210,.25);
}

.tagline {
    margin-top: 10px;

    font-family:
        "Playfair Display",
        Georgia,
        serif;

    font-style: italic;

    font-size: 11px;

    color:
        rgba(255,220,245,.55);
}

.status {
    display: inline-flex;

    align-items: center;

    gap: 8px;

    margin-top: 13px;

    padding: 7px 11px;

    border-radius: 999px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid rgba(255,255,255,.07);

    font-size: 9px;

    color:
        rgba(255,255,255,.65);
}

.online-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #42ff98;

    box-shadow:
        0 0 10px #42ff98;
}

.join-main {
    display: flex;

    align-items: center;
    justify-content: center;

    width: min(650px, 92%);

    min-height: 54px;

    margin: 22px auto 0;

    border-radius: 13px;

    text-decoration: none;

    color: white;

    font-size: 11px;
    font-weight: 700;

    background:
        linear-gradient(
            90deg,
            #5146ff,
            #a800ff,
            #ff00a8
        );

    box-shadow:
        0 12px 35px rgba(177,0,255,.24);

    transition:
        transform .3s ease,
        box-shadow .3s ease;
}

.join-main:hover {
    transform: translateY(-3px);

    box-shadow:
        0 15px 45px rgba(255,0,200,.4);
}


/* =========================================================
   SECTION
========================================================= */

.section {
    width: min(1000px, 94%);

    margin:
        0 auto
        70px;
}

.section-title {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 10px;

    margin-bottom: 20px;

    color: #f5d9ee;

    font-family:
        "Playfair Display",
        Georgia,
        serif;

    font-size: 18px;

    font-style: italic;

    text-shadow:
        0 0 12px rgba(255,0,200,.2);
}

.section-title::before,
.section-title::after {
    content: "";

    width: 80px;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,70,220,.45)
        );
}

.section-title::after {
    background:
        linear-gradient(
            90deg,
            rgba(255,70,220,.45),
            transparent
        );
}


/* =========================================================
   GAMING CARDS
========================================================= */

.games-grid {
    width: 100%;

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 18px;
}

.game-card {
    position: relative;

    min-height: 200px;

    overflow: hidden;

    border-radius: 18px;

    border:
        1px solid
        rgba(255,80,220,.25);

    background:
        rgba(18,5,27,.85);

    text-decoration: none;

    color: white;

    padding: 22px;

    display: flex;

    flex-direction: column;

    justify-content: flex-end;

    isolation: isolate;

    transition:
        transform .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;
}

.game-card:hover {
    transform:
        translateY(-7px)
        scale(1.015);

    border-color:
        rgba(255,70,225,.7);

    box-shadow:
        0 18px 50px
        rgba(190,0,255,.22),

        inset 0 0 35px
        rgba(255,0,220,.08);
}


/* Animated glow */
.card-glow {
    position: absolute;

    width: 220px;
    height: 220px;

    left: 50%;
    top: 38%;

    transform:
        translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(255,0,220,.25),
            transparent 68%
        );

    filter: blur(8px);

    animation:
        cardGlow 4s
        ease-in-out
        infinite;

    z-index: -3;
}

@keyframes cardGlow {

    0%,100% {
        transform:
            translate(-50%,-50%)
            scale(.75);

        opacity: .35;
    }

    50% {
        transform:
            translate(-50%,-50%)
            scale(1.35);

        opacity: .95;
    }
}


/* Moving light */
.light-sweep {
    position: absolute;

    top: -100%;
    left: -80%;

    width: 45%;
    height: 300%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );

    transform: rotate(20deg);

    animation:
        sweep 5s
        linear
        infinite;

    pointer-events: none;

    z-index: 0;
}

@keyframes sweep {

    0% {
        left: -90%;
    }

    100% {
        left: 160%;
    }
}


/* Particles */
.particles::before,
.particles::after {
    content: "";

    position: absolute;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: #ff58df;

    box-shadow:
        35px 20px 0 #b95cff,
        90px 50px 0 #ff72e7,
        150px 15px 0 #9f6cff,
        210px 75px 0 #ff4fd8,
        280px 35px 0 #b75cff,
        70px 120px 0 #ff62dd,
        230px 145px 0 #9f5cff;

    animation:
        floatingParticles
        5s
        ease-in-out
        infinite;
}

.particles::after {
    left: 40px;
    top: 30px;

    transform: scale(.7);

    animation-delay: 2s;
}

@keyframes floatingParticles {

    0%,100% {
        transform:
            translateY(10px);

        opacity: .3;
    }

    50% {
        transform:
            translateY(-18px);

        opacity: 1;
    }
}


/* Game logos */
.game-logo {
    position: absolute;

    top: 22px;
    left: 22px;

    width: 66px;
    height: 66px;

    object-fit: contain;

    border-radius: 14px;

    filter:
        drop-shadow(
            0 0 13px
            rgba(255,0,220,.4)
        );

    transition:
        transform .35s ease,
        filter .35s ease;

    z-index: 3;
}

.game-card:hover .game-logo {
    transform:
        scale(1.13)
        rotate(-2deg);

    filter:
        drop-shadow(
            0 0 23px
            rgba(255,0,220,.7)
        );
}


/* Game text */
.game-info {
    position: relative;

    z-index: 3;

    margin-top: 75px;
}

.game-info h3 {
    margin: 0 0 6px;

    font-family:
        "Playfair Display",
        Georgia,
        serif;

    font-size: 21px;

    font-style: italic;

    color: white;
}

.game-info p {
    margin: 0;

    font-size: 11px;

    color:
        rgba(255,255,255,.58);
}


/* Join VC */
.join-vc {
    position: absolute;

    top: 20px;
    right: 18px;

    padding:
        6px 10px;

    border-radius: 999px;

    font-size: 8px;

    letter-spacing: .5px;

    color: white;

    background:
        linear-gradient(
            90deg,
            rgba(105,60,255,.55),
            rgba(255,0,200,.55)
        );

    border:
        1px solid
        rgba(255,255,255,.12);

    z-index: 5;
}


/* Individual card atmospheres */
.ff-card {
    background:
        radial-gradient(
            circle at 75% 20%,
            rgba(255,30,80,.22),
            transparent 52%
        ),
        rgba(25,4,20,.88);
}

.roblox-card {
    background:
        radial-gradient(
            circle at 75% 20%,
            rgba(70,130,255,.20),
            transparent 52%
        ),
        rgba(5,10,30,.88);
}

.gta-card {
    background:
        radial-gradient(
            circle at 75% 20%,
            rgba(255,160,30,.18),
            transparent 52%
        ),
        rgba(25,10,5,.88);
}

.mc-card {
    background:
        radial-gradient(
            circle at 75% 20%,
            rgba(60,220,100,.18),
            transparent 52%
        ),
        rgba(5,25,15,.88);
}


/* =========================================================
   COMMUNITY
========================================================= */

.community-box {
    position: relative;

    padding: 35px 25px;

    border-radius: 22px;

    background:
        linear-gradient(
            135deg,
            rgba(110,0,100,.13),
            rgba(25,0,45,.25)
        );

    border:
        1px solid
        rgba(255,90,225,.14);

    overflow: hidden;
}

.community-box::before {
    content: "";

    position: absolute;

    width: 300px;
    height: 300px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    background:
        radial-gradient(
            circle,
            rgba(200,0,255,.12),
            transparent 70%
        );

    pointer-events: none;
}

.community-stats {
    display: grid;

    grid-template-columns:
        repeat(2,1fr);

    gap: 20px;

    text-align: center;
}

.stat-number {
    font-family:
        "Playfair Display",
        Georgia,
        serif;

    font-size: 50px;

    color: #ffe5f7;

    text-shadow:
        0 0 20px
        rgba(255,0,220,.25);
}

.stat-label {
    font-size: 10px;

    letter-spacing: 2px;

    color:
        rgba(255,255,255,.45);
}

.online-status {
    display: inline-flex;

    align-items: center;

    gap: 8px;

    font-size: 12px;

    color: #dfffe9;
}

.avatar-row {
    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 9px;

    margin-top: 25px;
}

.avatar {
    width: 39px;
    height: 39px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #271034,
            #101018
        );

    border:
        1px solid
        rgba(255,100,225,.3);

    box-shadow:
        0 0 12px
        rgba(255,0,200,.1);

    font-size: 13px;

    color: #f7bce9;
}


/* =========================================================
   OWNER CARD
========================================================= */

.owner-card {
    position: relative;

    display: grid;

    grid-template-columns:
        150px 1fr;

    gap: 30px;

    align-items: center;

    padding: 35px;

    border-radius: 24px;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 15% 50%,
            rgba(255,0,160,.12),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            rgba(25,8,30,.96),
            rgba(10,5,17,.96)
        );

    border:
        1px solid
        rgba(255,70,220,.16);
}

.owner-avatar {
    width: 135px;
    height: 135px;

    border-radius: 50%;

    padding: 4px;

    background:
        linear-gradient(
            135deg,
            #ff00c8,
            #762cff,
            #ff00c8
        );

    box-shadow:
        0 0 30px
        rgba(255,0,200,.3);
}

.owner-avatar img {
    width: 100%;
    height: 100%;

    border-radius: 50%;

    object-fit: cover;

    border:
        4px solid
        #0a050d;
}

.owner-badge {
    display: inline-block;

    margin-bottom: 8px;

    padding: 6px 11px;

    border-radius: 999px;

    background:
        rgba(255,200,80,.08);

    border:
        1px solid
        rgba(255,200,100,.18);

    color:
        #ffd889;

    font-size: 9px;

    letter-spacing: 1px;
}

.owner-info h2 {
    font-family:
        "Playfair Display",
        Georgia,
        serif;

    font-size: 40px;

    font-style: italic;

    color: #fff;
}

.owner-role {
    margin-top: 4px;

    color:
        rgba(255,190,235,.65);

    font-family:
        "Playfair Display",
        Georgia,
        serif;

    font-style: italic;

    font-size: 13px;
}

.owner-quote {
    margin-top: 18px;

    padding-left: 15px;

    border-left:
        2px solid
        #ff38ce;

    color:
        rgba(255,255,255,.62);

    font-size: 12px;

    line-height: 1.7;
}


/* =========================================================
   ABOUT
========================================================= */

.about-grid {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 20px;
}

.info-card {
    padding: 28px;

    border-radius: 20px;

    background:
        rgba(20,7,28,.7);

    border:
        1px solid
        rgba(255,80,220,.12);
}

.info-card h3 {
    margin-bottom: 14px;

    font-family:
        "Playfair Display",
        Georgia,
        serif;

    font-size: 24px;

    font-style: italic;

    color: #ffe0f3;
}

.info-card p {
    font-size: 12px;

    line-height: 1.9;

    color:
        rgba(255,255,255,.55);
}

.rules {
    display: grid;

    gap: 10px;
}

.rule {
    display: flex;

    gap: 10px;

    font-size: 11px;

    color:
        rgba(255,255,255,.64);
}

.rule span {
    color: #ff54d8;

    font-weight: 700;
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    margin-top: 80px;

    padding:
        35px 20px
        50px;

    text-align: center;

    border-top:
        1px solid
        rgba(255,255,255,.06);

    background:
        rgba(0,0,0,.22);
}

.footer-title {
    font-family:
        "Playfair Display",
        Georgia,
        serif;

    font-style: italic;

    font-size: 22px;

    color: #f7cce9;
}

.footer-sub {
    margin-top: 8px;

    font-size: 10px;

    color:
        rgba(255,255,255,.38);
}

.footer-copy {
    margin-top: 18px;

    font-size: 9px;

    color:
        rgba(255,255,255,.22);
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    header {
        height: 55px;

        padding:
            0 13px;
    }

    .header-btn {
        padding:
            7px 10px;

        font-size: 7px;
    }

    .banner {
        height: 235px !important;
    }

    .banner img {
        object-position: center center !important;
    }

    .hero {
        padding:
            0 14px
            35px;
    }

    .logo-wrap {
