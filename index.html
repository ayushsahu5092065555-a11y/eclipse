<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eclipse //</title>

<meta name="description" content="Eclipse // Gaming Community">
<meta name="theme-color" content="#120018">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background:
        radial-gradient(circle at 50% 10%, rgba(170, 0, 255, .16), transparent 35%),
        radial-gradient(circle at 10% 60%, rgba(255, 0, 150, .09), transparent 30%),
        #070509;

    color: #fff;
    font-family: "Poppins", sans-serif;
    overflow-x: hidden;
}


/* =========================================================
   BACKGROUND
========================================================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    background:
        radial-gradient(circle at 20% 30%, rgba(255, 0, 170, .05), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(100, 0, 255, .05), transparent 25%);

    pointer-events: none;
    z-index: -2;
}


/* =========================================================
   FALLING PETALS
========================================================= */

.petal {
    position: fixed;
    top: -30px;

    width: 7px;
    height: 12px;

    background: #ff73c9;

    border-radius: 100% 0 100% 0;

    opacity: .7;

    animation: fall linear infinite;

    filter: drop-shadow(0 0 5px rgba(255, 50, 180, .7));

    pointer-events: none;

    z-index: 10;
}

.p1 { left: 7%; animation-duration: 10s; animation-delay: -2s; }
.p2 { left: 18%; animation-duration: 13s; animation-delay: -5s; }
.p3 { left: 31%; animation-duration: 9s; animation-delay: -1s; }
.p4 { left: 46%; animation-duration: 14s; animation-delay: -7s; }
.p5 { left: 59%; animation-duration: 11s; animation-delay: -3s; }
.p6 { left: 72%; animation-duration: 15s; animation-delay: -6s; }
.p7 { left: 84%; animation-duration: 10s; animation-delay: -4s; }
.p8 { left: 94%; animation-duration: 12s; animation-delay: -8s; }

@keyframes fall {

    0% {
        transform:
            translateY(-40px)
            rotate(0deg)
            translateX(0);
    }

    50% {
        transform:
            translateY(55vh)
            rotate(180deg)
            translateX(40px);
    }

    100% {
        transform:
            translateY(110vh)
            rotate(360deg)
            translateX(-30px);
    }
}


/* =========================================================
   HEADER
========================================================= */

header {
    position: sticky;
    top: 0;

    height: 58px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    background: rgba(8, 5, 12, .82);

    backdrop-filter: blur(14px);

    border-bottom: 1px solid rgba(255, 90, 210, .14);

    z-index: 50;
}

.brand {
    font-family: "Playfair Display", serif;
    font-style: italic;

    font-size: 19px;

    color: #ffd2f2;

    text-shadow:
        0 0 12px rgba(255, 80, 200, .55);
}

.header-btn {
    text-decoration: none;

    padding: 7px 14px;

    border-radius: 30px;

    font-size: 8px;
    font-weight: 700;

    color: white;

    background:
        linear-gradient(90deg, #664cff, #ff009d);

    box-shadow:
        0 0 15px rgba(255, 0, 170, .35);

    transition: .25s;
}

.header-btn:hover {
    transform: scale(1.05);
}


/* =========================================================
   BIG SERVER BANNER
========================================================= */

.banner {
    width: 100%;

    /*
       BIGGER THAN BEFORE
       Desktop: 235px
       Mobile: 190px
    */

    height: 235px;

    position: relative;

    overflow: hidden;

    background: #15001d;

    border-bottom:
        1px solid rgba(255, 0, 180, .22);
}

.banner::after {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            to bottom,
            transparent 35%,
            rgba(8, 2, 12, .3) 65%,
            #09030d 100%
        );

    pointer-events: none;
}

.banner img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    object-position: center;

    transform: scale(1.02);

    filter:
        brightness(.83)
        saturate(1.1);

    transition: transform 1s ease;
}

.banner:hover img {
    transform: scale(1.05);
}


/* =========================================================
   HERO
========================================================= */

.hero {
    max-width: 900px;

    margin: 0 auto;

    padding:
        0 18px 45px;

    text-align: center;

    position: relative;
}


/* LOGO */

.logo-wrap {
    position: relative;

    width: 112px;
    height: 112px;

    margin:
        -56px auto 10px;

    border-radius: 50%;

    padding: 4px;

    background:
        linear-gradient(
            135deg,
            #ff00ae,
            #8c43ff,
            #00d9ff
        );

    box-shadow:
        0 0 25px rgba(255, 0, 190, .45);

    z-index: 5;
}

.logo-wrap img {
    width: 100%;
    height: 100%;

    border-radius: 50%;

    object-fit: cover;

    display: block;

    background: #08030d;
}


/* TITLE */

.hero h1 {
    font-family: "Playfair Display", serif;

    font-size: clamp(42px, 8vw, 68px);

    font-style: italic;

    color: #ffd8f3;

    line-height: 1;

    text-shadow:
        0 0 15px rgba(255, 70, 190, .3);
}

.tagline {
    margin-top: 10px;

    color: rgba(255, 210, 240, .7);

    font-family: "Playfair Display", serif;

    font-size: 12px;

    font-style: italic;
}


/* =========================================================
   STATS
========================================================= */

.stats {
    display: flex;

    justify-content: center;

    gap: 7px;

    margin-top: 14px;
}

.stat {
    padding: 6px 10px;

    border-radius: 30px;

    background: rgba(255,255,255,.035);

    border:
        1px solid rgba(255,255,255,.08);

    font-size: 9px;

    color: rgba(255,255,255,.78);

    backdrop-filter: blur(8px);
}

.online-dot {
    display: inline-block;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #36ff9a;

    box-shadow:
        0 0 8px #36ff9a;

    margin-right: 4px;
}


/* =========================================================
   DISCORD BUTTON
========================================================= */

.discord-btn {
    display: flex;

    align-items: center;
    justify-content: center;

    width: min(100%, 600px);

    min-height: 48px;

    margin: 22px auto 0;

    text-decoration: none;

    color: white;

    font-size: 11px;

    font-weight: 600;

    letter-spacing: .5px;

    border-radius: 13px;

    background:
        linear-gradient(
            90deg,
            #5959ff,
            #7b35ff,
            #ff008f
        );

    box-shadow:
        0 8px 35px rgba(150, 0, 255, .22),
        0 0 25px rgba(255, 0, 150, .15);

    transition:
        transform .25s,
        box-shadow .25s;
}

.discord-btn:hover {
    transform: translateY(-3px);

    box-shadow:
        0 12px 45px rgba(255, 0, 180, .35);
}


/* =========================================================
   SECTION
========================================================= */

section {
    width: min(100% - 18px, 900px);

    margin: 0 auto 34px;
}

.section-title {
    display: flex;

    align-items: center;
    gap: 12px;

    justify-content: center;

    margin-bottom: 17px;

    color: #ffd1ec;

    font-family: "Playfair Display", serif;

    font-size: 19px;

    font-style: italic;

    text-align: center;
}

.section-title::before,
.section-title::after {
    content: "";

    height: 1px;

    flex: 1;

    max-width: 95px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 30, 180, .65)
        );
}

.section-title::after {
    background:
        linear-gradient(
            90deg,
            rgba(255, 30, 180, .65),
            transparent
        );
}


/* =========================================================
   GAME CARDS
========================================================= */

.games {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 9px;
}

.game-card {
    position: relative;

    min-height: 145px;

    padding: 14px;

    overflow: hidden;

    border-radius: 15px;

    border:
        1px solid rgba(255, 80, 210, .16);

    background:
        linear-gradient(
            145deg,
            rgba(50, 8, 65, .48),
            rgba(10, 5, 18, .78)
        );

    box-shadow:
        inset 0 0 35px rgba(180, 0, 180, .035);

    transition:
        transform .3s,
        border-color .3s,
        box-shadow .3s;
}


/* animated glow */

.game-card::before {
    content: "";

    position: absolute;

    width: 150px;
    height: 150px;

    top: -80px;
    right: -50px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255, 0, 180, .3),
            transparent 68%
        );

    animation:
        cardGlow 4s ease-in-out infinite alternate;

    pointer-events: none;
}

.game-card::after {
    content: "";

    position: absolute;

    width: 45%;
    height: 2px;

    top: 0;
    left: -50%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 100, 220, .8),
            transparent
        );

    animation:
        lightSweep 5s linear infinite;

    pointer-events: none;
}

@keyframes cardGlow {

    from {
        transform: translate(0, 0) scale(.8);
        opacity: .4;
    }

    to {
        transform: translate(-25px, 35px) scale(1.25);
        opacity: .8;
    }
}

@keyframes lightSweep {

    0% {
        left: -50%;
    }

    45%,100% {
        left: 120%;
    }
}

.game-card:hover {
    transform: translateY(-4px);

    border-color:
        rgba(255, 70, 210, .42);

    box-shadow:
        0 12px 35px rgba(100, 0, 120, .22);
}

.game-card img {
    width: 38px;
    height: 38px;

    object-fit: cover;

    border-radius: 9px;

    display: block;

    margin-bottom: 10px;

    position: relative;

    z-index: 2;

    box-shadow:
        0 0 14px rgba(255, 0, 180, .2);
}

.game-card h3 {
    font-family: "Playfair Display", serif;

    font-size: 15px;

    font-style: italic;

    color: #fff;

    position: relative;
    z-index: 2;
}

.game-card p {
    margin-top: 3px;

    font-size: 7px;

    line-height: 1.6;

    color: rgba(255,255,255,.5);

    position: relative;
    z-index: 2;
}

.join-mini {
    position: absolute;

    top: 12px;
    right: 10px;

    z-index: 3;

    padding: 5px 8px;

    border-radius: 20px;

    color: #6fffea;

    font-size: 6px;

    text-decoration: none;

    border:
        1px solid rgba(0, 240, 255, .25);

    background:
        rgba(0, 180, 220, .06);
}


/* =========================================================
   COMMUNITY
========================================================= */

.community-box {
    position: relative;

    padding: 18px;

    min-height: 110px;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            rgba(35, 5, 45, .55),
            rgba(9, 5, 15, .78)
        );

    border:
        1px solid rgba(255, 80, 210, .13);

    overflow: hidden;
}

.community-box::before {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    right: -80px;
    bottom: -100px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255, 0, 180, .15),
            transparent 70%
        );
}

.member-count {
    font-size: 27px;

    font-weight: 600;

    color: #fff;

    line-height: 1;
}

.member-label {
    margin-top: 5px;

    font-size: 7px;

    text-transform: uppercase;

    letter-spacing: 1px;

    color: rgba(255,255,255,.48);
}

.online-count {
    position: absolute;

    right: 18px;
    top: 20px;

    color: #45ffab;

    font-size: 8px;
}

.online-count span {
    display: inline-block;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #45ffab;

    box-shadow:
        0 0 9px #45ffab;

    margin-right: 4px;
}


/* clean avatar placeholders */

.avatar-row {
    display: flex;

    align-items: center;

    margin-top: 18px;
}

.avatar {
    width: 29px;
    height: 29px;

    border-radius: 50%;

    margin-right: -4px;

    border:
        2px solid #150818;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 9px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #625cff,
            #ff35b9
        );

    box-shadow:
        0 0 8px rgba(255, 0, 180, .18);
}

.avatar.more {
    background:
        rgba(255,255,255,.08);

    color:
        rgba(255,255,255,.7);
}


/* =========================================================
   ABOUT
========================================================= */

.about-box {
    padding: 18px;

    border-radius: 15px;

    background:
        linear-gradient(
            145deg,
            rgba(35, 5, 45, .5),
            rgba(7, 4, 12, .78)
        );

    border:
        1px solid rgba(255, 80, 210, .13);
}

.owner {
    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 18px;
}

.owner-logo {
    width: 47px;
    height: 47px;

    border-radius: 50%;

    object-fit: cover;

    border:
        2px solid #ff38b8;

    box-shadow:
        0 0 15px rgba(255, 0, 170, .3);
}

.owner small {
    display: block;

    color: rgba(255,255,255,.45);

    font-size: 7px;
}

.owner strong {
    display: block;

    margin-top: 2px;

    font-size: 12px;
}

.quote {
    border-left:
        2px solid #ff27b5;

    padding-left: 10px;

    color: #ffc7e9;

    font-family: "Playfair Display", serif;

    font-style: italic;

    font-size: 11px;

    margin-bottom: 18px;
}

.about-box h4 {
    font-family: "Playfair Display", serif;

    font-size: 13px;

    margin-bottom: 6px;

    color: #ffd8ee;
}

.about-box p {
    font-size: 8px;

    line-height: 1.8;

    color: rgba(255,255,255,.58);

    margin-bottom: 17px;
}


/* =========================================================
   RULES
========================================================= */

.rules {
    list-style: none;
}

.rules li {
    padding: 9px 0;

    border-bottom:
        1px solid rgba(255,255,255,.06);

    font-size: 8px;

    color: rgba(255,255,255,.62);
}

.rules li:last-child {
    border-bottom: none;
}

.rules b {
    color: #ff8ad1;

    margin-right: 7px;
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    text-align: center;

    padding:
        35px 18px 45px;

    color: rgba(255,255,255,.32);

    font-size: 8px;
}

footer strong {
    color: #ff8ed4;

    font-family: "Playfair Display", serif;

    font-style: italic;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    header {
        height: 54px;
    }

    .brand {
        font-size: 17px;
    }

    .header-btn {
        font-size: 7px;
        padding: 6px 11px;
    }

    /* BIG MOBILE BANNER */

    .banner {
        height: 190px;
    }

    .banner img {
        object-position: center;
    }

    .logo-wrap {
        width: 100px;
        height: 100px;

        margin-top: -50px;
    }

    .hero {
        padding-bottom: 34px;
    }

    .hero h1 {
        font-size: 43px;
    }

    .tagline {
        font-size: 9px;
    }

    .stats {
        gap: 5px;
    }

    .stat {
        font-size: 8px;
        padding: 5px 8px;
    }

    .discord-btn {
        min-height: 46px;

        font-size: 9px;
    }

    .section-title {
        font-size: 17px;
    }

    .games {
        gap: 8px;
    }

    .game-card {
        min-height: 140px;

        padding: 12px;
    }

    .game-card img {
        width: 36px;
        height: 36px;
    }

    .game-card h3 {
        font-size: 14px;
    }

    .game-card p {
        font-size: 6.5px;
    }

    .join-mini {
        font-size: 5.5px;
        padding: 4px 7px;
    }

}


/* very small phones */

@media (max-width: 370px) {

    .banner {
        height: 175px;
    }

    .hero h1 {
        font-size: 37px;
    }

    .games {
        grid-template-columns: 1fr;
    }

}

</style>
</head>
