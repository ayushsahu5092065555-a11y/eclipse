<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eclipse // Official Community</title>

<meta name="description" content="Eclipse // Official Discord Community">
<meta name="theme-color" content="#050008">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@1,600;1,700;1,800&display=swap" rel="stylesheet">

<style>

/* =========================================================
   ECLIPSE // VARIABLES
========================================================= */

:root{
    --bg:#030107;
    --bg2:#0b0014;

    --pink:#ff2a85;
    --pink-light:#ffb6d8;
    --purple:#8a2be2;
    --blue:#5865f2;
    --cyan:#00eaff;

    --white:#ffffff;
    --muted:#afa2bc;
    --card:rgba(17,6,29,.82);

    --main-font:'Plus Jakarta Sans',sans-serif;
    --eclipse-font:'Playfair Display',serif;
}

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;

    color:var(--white);

    font-family:var(--main-font);

    background:
        radial-gradient(
            circle at 50% 10%,
            rgba(138,43,226,.20),
            transparent 34%
        ),
        radial-gradient(
            circle at 0% 45%,
            rgba(255,42,133,.09),
            transparent 28%
        ),
        linear-gradient(
            180deg,
            #09000f 0%,
            #030107 80%
        );
}

a{
    -webkit-tap-highlight-color:transparent;
}

/* =========================================================
   ANIME NIGHT BACKGROUND
========================================================= */

.anime-bg{
    position:fixed;
    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:-20;

    background:
        radial-gradient(
            circle at 50% 25%,
            rgba(255,42,133,.08),
            transparent 36%
        ),
        linear-gradient(
            180deg,
            #09000f,
            #100017 40%,
            #030107 100%
        );
}

/* Moon */

.moon{
    position:absolute;

    top:100px;
    right:10%;

    width:90px;
    height:90px;

    border-radius:50%;

    background:#ffd9ea;

    opacity:.82;

    box-shadow:
        0 0 30px rgba(255,180,220,.55),
        0 0 90px rgba(255,42,133,.18);
}

.moon::after{
    content:"";

    position:absolute;

    top:-8px;
    left:25px;

    width:90px;
    height:90px;

    border-radius:50%;

    background:#0b0013;
}

/* Glows */

.glow{
    position:absolute;

    width:190px;
    height:190px;

    border-radius:50%;

    filter:blur(65px);

    opacity:.23;
}

.glow-one{
    left:-90px;
    top:25%;

    background:#ff2a85;
}

.glow-two{
    right:-90px;
    top:55%;

    background:#8a2be2;
}

/* =========================================================
   FALLING SAKURA PETALS
========================================================= */

.petal{
    position:fixed;

    top:-40px;

    width:13px;
    height:8px;

    border-radius:100% 0 100% 0;

    background:
        linear-gradient(
            135deg,
            #ffe1ef,
            #ff4b9b
        );

    box-shadow:
        0 0 9px rgba(255,42,133,.65);

    opacity:.85;

    pointer-events:none;

    z-index:-5;

    animation:
        fall linear infinite,
        sway ease-in-out infinite;
}

.p1{
    left:3%;
    animation-duration:9s,3s;
}

.p2{
    left:14%;
    animation-duration:12s,3.5s;
    animation-delay:2s;
}

.p3{
    left:27%;
    animation-duration:8s,2.7s;
    animation-delay:4s;
}

.p4{
    left:41%;
    animation-duration:11s,3.2s;
    animation-delay:1s;
}

.p5{
    left:56%;
    animation-duration:9s,2.8s;
    animation-delay:3s;
}

.p6{
    left:72%;
    animation-duration:13s,3.5s;
    animation-delay:1s;
}

.p7{
    left:87%;
    animation-duration:10s,2.9s;
    animation-delay:5s;
}

.p8{
    left:96%;
    animation-duration:14s,3.4s;
    animation-delay:2s;
}

@keyframes fall{

    0%{
        transform:
            translateY(-60px)
            rotate(0deg);

        opacity:0;
    }

    10%{
        opacity:.9;
    }

    90%{
        opacity:.9;
    }

    100%{
        transform:
            translateY(115vh)
            rotate(520deg);

        opacity:0;
    }
}

@keyframes sway{

    0%,100%{
        margin-left:-15px;
    }

    50%{
        margin-left:25px;
    }
}

/* =========================================================
   HEADER
========================================================= */

header{
    position:sticky;
    top:0;

    z-index:100;

    width:100%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:14px 18px;

    background:
        rgba(5,1,10,.82);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    border-bottom:
        1px solid rgba(255,255,255,.07);
}

.brand{
    color:white;

    font-family:var(--eclipse-font);

    font-size:23px;

    font-weight:800;
    font-style:italic;

    letter-spacing:2px;

    text-shadow:
        0 0 18px rgba(255,42,133,.45);
}

.header-join{
    padding:9px 15px;

    border-radius:22px;

    color:white;

    text-decoration:none;

    font-size:10px;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            var(--blue),
            var(--pink)
        );

    box-shadow:
        0 5px 18px rgba(255,42,133,.25);
}

/* =========================================================
   MAIN CONTAINER
========================================================= */

.container{
    width:100%;
    max-width:1150px;

    margin:0 auto;
}

/* =========================================================
   HERO
========================================================= */

.hero{
    width:100%;

    text-align:center;

    padding-bottom:20px;
}

/* SMALL SERVER BANNER */

.server-banner{
    position:relative;

    width:100%;

    height:130px;

    overflow:hidden;

    background:#000;
}

.server-banner img{
    display:block;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center;

    filter:
        brightness(.58)
        saturate(.88);
}

.server-banner::after{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(3,1,7,.08),
            rgba(3,1,7,.96)
        );
}

/* HERO CONTENT */

.hero-content{
    position:relative;

    z-index:2;

    margin-top:-39px;

    padding:0 15px;
}

/* LOGO */

.server-logo{
    width:88px;
    height:88px;

    margin:auto;

    padding:3px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            var(--pink),
            var(--purple),
            var(--cyan)
        );

    box-shadow:
        0 0 25px rgba(255,42,133,.58);
}

.server-logo img{
    display:block;

    width:100%;
    height:100%;

    border-radius:50%;

    object-fit:cover;

    background:#000;
}

/* SERVER NAME */

.server-name{
    margin-top:10px;

    color:#ffd5e8;

    font-family:var(--eclipse-font);

    font-size:
        clamp(40px,10vw,68px);

    font-weight:800;
    font-style:italic;

    line-height:1.05;

    letter-spacing:3px;

    text-shadow:
        0 0 22px rgba(255,42,133,.35);
}

/* TAGLINE */

.tagline{
    margin-top:5px;

    color:#d1c0dd;

    font-family:var(--eclipse-font);

    font-size:13px;

    font-style:italic;
}

/* STATS */

.stats{
    display:inline-flex;

    align-items:center;

    gap:12px;

    margin-top:14px;

    padding:8px 15px;

    border-radius:25px;

    color:#eee;

    background:
        rgba(255,255,255,.05);

    border:
        1px solid rgba(255,255,255,.10);

    backdrop-filter:blur(10px);

    font-size:11px;
    font-weight:700;
}

.online-dot{
    display:inline-block;

    width:7px;
    height:7px;

    margin-right:4px;

    border-radius:50%;

    background:#23d879;

    box-shadow:
        0 0 9px #23d879;
}

/* =========================================================
   MAIN DISCORD BUTTON
========================================================= */

.main-join{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:11px;

    width:min(92%,560px);

    margin:21px auto 0;

    padding:16px 20px;

    border-radius:17px;

    color:white !important;

    text-decoration:none;

    background:
        linear-gradient(
            135deg,
            #5865f2,
            #8a2be2,
            #ff1681
        );

    font-size:15px;
    font-weight:900;

    letter-spacing:.8px;

    box-shadow:
        0 10px 32px rgba(255,42,133,.27),
        0 5px 22px rgba(88,101,242,.20);

    transition:.2s ease;
}

.main-join:hover{
    transform:translateY(-2px);

    box-shadow:
        0 14px 40px rgba(255,42,133,.40);
}

.discord-icon{
    width:24px;
    height:24px;

    fill:white;
}

/* =========================================================
   SECTION TITLES
========================================================= */

.section-title{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:12px;

    margin:
        28px 16px 18px;

    color:#ffb9da;

    font-family:var(--eclipse-font);

    font-size:23px;

    font-weight:700;
    font-style:italic;

    letter-spacing:1px;

    text-align:center;
}

.section-title::before,
.section-title::after{
    content:"";

    height:1px;

    flex:1;

    max-width:150px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,42,133,.65)
        );
}

.section-title::after{
    background:
        linear-gradient(
            90deg,
            rgba(255,42,133,.65),
            transparent
        );
}

/* =========================================================
   GAMING SQUADS
========================================================= */

.games{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:13px;

    padding:0 14px;
}

.game{
    min-height:145px;

    padding:14px;

    border-radius:18px;

    color:white;

    text-decoration:none;

    background:
        linear-gradient(
            145deg,
            rgba(19,7,32,.94),
            rgba(5,2,11,.86)
        );

    border:
        1px solid rgba(255,42,133,.18);

    box-shadow:
        inset 0 1px rgba(255,255,255,.03);

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;
}

.game:hover{
    transform:translateY(-4px);

    border-color:
        rgba(255,42,133,.58);

    box-shadow:
        0 12px 35px rgba(255,42,133,.14);
}

.game-top{
    display:flex;

    align-items:center;
    justify-content:space-between;
}

.game-logo{
    width:52px;
    height:52px;

    overflow:hidden;

    border-radius:13px;

    background:#05030a;

    border:
        1px solid rgba(255,255,255,.14);

    box-shadow:
        0 4px 15px rgba(0,0,0,.5);
}

.game-logo img{
    display:block;

    width:100%;
    height:100%;

    object-fit:cover;
}

.vc{
    padding:5px 8px;

    border-radius:12px;

    color:var(--cyan);

    background:
        rgba(0,234,255,.07);

    border:
        1px solid rgba(0,234,255,.25);

    font-size:8px;
    font-weight:900;
}

.game-info{
    margin-top:16px;
}

.game-name{
    color:#fff;

    font-family:var(--eclipse-font);

    font-size:18px;

    font-weight:800;
    font-style:italic;
}

.game-desc{
    margin-top:4px;

    color:#a99bb8;

    font-size:10px;

    line-height:1.5;
}

/* =========================================================
   COMMUNITY
========================================================= */

.community{
    margin:0 14px;

    padding:21px 19px;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            rgba(15,5,27,.90),
            rgba(4,1,9,.80)
        );

    border:
        1px solid rgba(255,42,133,.17);
}

.community-top{
    display:flex;

    align-items:flex-start;
    justify-content:space-between;
}

.member-number{
    color:white;

    font-size:35px;

    font-weight:900;
}

.member-label{
    margin-top:3px;

    color:#9d91a9;

    font-size:9px;

    letter-spacing:1px;
}

.online-now{
    color:#28e77e;

    font-size:11px;

    font-weight:900;

    text-align:right;
}

.online-now small{
    display:block;

    margin-top:4px;

    color:#438d68;

    font-size:8px;
}

/* AVATARS */

.avatars{
    display:flex;

    gap:8px;

    overflow-x:auto;

    margin-top:18px;

    padding-bottom:2px;

    scrollbar-width:none;
}

.avatars::-webkit-scrollbar{
    display:none;
}

.avatar{
    flex:0 0 auto;

    width:40px;
    height:40px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    border:
        2px solid rgba(255,255,255,.16);

    box-shadow:
        0 4px 14px rgba(0,0,0,.5);

    font-size:15px;
}

.a1{background:#5865f2;}
.a2{background:#ff2a85;}
.a3{background:#00a9c5;}
.a4{background:#8a2be2;}
.a5{background:#ff6b9f;}
.a6{background:#e84747;}
.a7{background:#d99500;}
.a8{background:#23a55a;}

.avatar.more{
    color:#ddd;

    background:
        rgba(255,255,255,.06);

    font-size:20px;
}

/* =========================================================
   ABOUT / OWNER
========================================================= */

.owner{
    margin:0 14px;

    padding:23px 19px 27px;

    border-radius:21px;

    background:
        linear-gradient(
            145deg,
            rgba(20,7,34,.92),
            rgba(3,1,7,.93)
        );

    border:
        1px solid rgba(255,42,133,.18);
}

.owner-head{
    display:flex;

    align-items:center;

    gap:14px;
}

.owner-avatar{
    width:67px;
    height:67px;

    flex:0 0 auto;

    padding:3px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #ffd700,
            #ff2a85
        );

    box-shadow:
        0 0 20px rgba(255,215,0,.30);
}

.owner-avatar img{
    display:block;

    width:100%;
    height:100%;

    border-radius:50%;

    object-fit:cover;
}

.owner-badge{
    display:inline-block;

    margin-bottom:5px;

    padding:4px 8px;

    border-radius:7px;

    color:#ffd700;

    background:
        rgba(255,215,0,.08);

    border:
        1px solid rgba(255,215,0,.27);

    font-size:8px;

    font-weight:900;

    letter-spacing:1px;
}

.owner-name{
    color:white;

    font-size:23px;

    font-weight:900;

    letter-spacing:1px;
}

.quote{
    margin-top:18px;

    padding-left:13px;

    border-left:
        3px solid var(--pink);

    color:#ffb4d6;

    font-family:var(--eclipse-font);

    font-size:15px;

    font-style:italic;

    line-height:1.6;
}

.about-title,
.rules-title{
    margin-top:23px;
    margin-bottom:9px;

    color:white;

    font-size:18px;

    font-weight:900;
}

.about{
    color:#d0c3dc;

    font-size:12px;

    line-height:1.75;
}

/* RULES */

.rules{
    display:flex;

    flex-direction:column;

    gap:9px;

    list-style:none;
}

.rules li{
    padding-bottom:9px;

    color:#c9bcd5;

    border-bottom:
        1px solid rgba(255,255,255,.05);

    font-size:11px;

    line-height:1.6;
}

.rules b{
    color:white;
}

/* =========================================================
   FOOTER
========================================================= */

footer{
    padding:
        30px 20px 42px;

    color:#766b81;

    text-align:center;

    font-size:9px;

    line-height:1.7;
}

.footer-name{
    margin-bottom:4px;

    color:#ff9dca;

    font-family:var(--eclipse-font);

    font-size:18px;

    font-style:italic;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

    header{
        padding:13px 15px;
    }

    .brand{
        font-size:21px;
    }

    .header-join{
        padding:8px 12px;

        font-size:9px;
    }

    .server-banner{
        height:125px;
    }

    .server-logo{
        width:85px;
        height:85px;
    }

    .hero-content{
        margin-top:-35px;
    }

    .server-name{
        font-size:42px;

        letter-spacing:2px;
    }

    .tagline{
        font-size:11px;
    }

    .main-join{
        width:92%;

        padding:15px;

        font-size:14px;
    }

    .section-title{
        margin-top:27px;

        font-size:21px;
    }

    .games{
        gap:10px;

        padding:0 12px;
    }

    .game{
        min-height:138px;

        padding:12px;
    }

    .game-logo{
        width:48px;
        height:48px;
    }

    .game-name{
        font-size:16px;
    }

    .game-desc{
        font-size:9px;
    }

    .community,
    .owner{
        margin-left:12px;
        margin-right:12px;
    }
}

/* =========================================================
   SMALL PHONES
========================================================= */

@media(max-width:380px){

    .server-banner{
        height:115px;
    }

    .server-logo{
        width:80px;
        height:80px;
    }

    .server-name{
        font-size:36px;
    }

    .tagline{
        font-size:10px;
    }

    .stats{
        font-size:9px;

        gap:8px;

        padding:7px 11px;
    }

    .games{
        gap:8px;
    }

    .game{
        min-height:132px;

        padding:10px;
    }

    .game-logo{
        width:45px;
        height:45px;
    }

    .vc{
        padding:4px 6px;

        font-size:7px;
    }

    .game-name{
        font-size:15px;
    }
}

/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    html{
        scroll-behavior:auto;
    }

    .petal{
        display:none;
    }

    .game,
    .main-join{
        transition:none;
    }
}

</style>
</head>


<body>

<!-- =====================================================
     ANIME BACKGROUND
===================================================== -->

<div class="anime-bg">

    <div class="moon"></div>

    <div class="glow glow-one"></div>

    <div class="glow glow-two"></div>

</div>


<!-- FALLING PETALS -->

<div class="petal p1"></div>
<div class="petal p2"></div>
<div class="petal p3"></div>
<div class="petal p4"></div>
<div class="petal p5"></div>
<div class="petal p6"></div>
<div class="petal p7"></div>
<div class="petal p8"></div>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="brand">
        Eclipse //
    </div>

    <a
        class="header-join"
        href="https://discord.gg/yAsXSvxdy"
        target="_blank"
        rel="noopener"
    >
        JOIN DISCORD
    </a>

</header>


<div class="container">


<!-- =====================================================
     HERO
===================================================== -->

<section class="hero">


    <!-- YOUR EXISTING BANNER -->

    <div class="server-banner">

        <img
            src="banner.gif"
            alt="Eclipse Server Banner"
            onerror="this.src='banner.jpg'"
        >

    </div>


    <div class="hero-content">


        <!-- YOUR EXISTING LOGO -->

        <div class="server-logo">

            <img
                src="logo.png"
                alt="Eclipse Logo"
            >

        </div>


        <h1 class="server-name">
            Eclipse //
        </h1>


        <p class="tagline">
            active chat · gaming squads · midnight shaya
