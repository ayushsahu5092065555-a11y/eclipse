/* =====================================================
   ECLIPSE // GLOBAL
===================================================== */

:root{
    --bg:#030107;
    --bg2:#0b0014;

    --pink:#ff2a85;
    --pink2:#ff9dca;
    --purple:#8a2be2;
    --discord:#5865f2;
    --cyan:#00eaff;

    --white:#fff;
    --muted:#b8a8c7;

    --main-font:'Plus Jakarta Sans',sans-serif;
    --eclipse-font:'Playfair Display',serif;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    overflow-x:hidden;

    color:white;

    font-family:var(--main-font);

    background:
        radial-gradient(
            circle at 50% 12%,
            rgba(138,43,226,.22),
            transparent 32%
        ),
        radial-gradient(
            circle at 10% 50%,
            rgba(255,42,133,.10),
            transparent 28%
        ),
        linear-gradient(
            180deg,
            #08000e,
            #030107 70%
        );
}

/* =====================================================
   ANIME NIGHT BACKGROUND
===================================================== */

.anime-bg{
    position:fixed;
    inset:0;

    pointer-events:none;

    overflow:hidden;

    z-index:-10;

    background:
        radial-gradient(
            circle at 50% 25%,
            rgba(255,42,133,.08),
            transparent 35%
        ),
        linear-gradient(
            180deg,
            #09000f 0%,
            #110019 38%,
            #050008 100%
        );
}

/* moon */

.moon{
    position:absolute;

    top:90px;
    right:11%;

    width:85px;
    height:85px;

    border-radius:50%;

    background:#ffd1e7;

    opacity:.82;

    box-shadow:
        0 0 25px rgba(255,150,210,.55),
        0 0 80px rgba(255,42,133,.20);
}

.moon::after{
    content:"";

    position:absolute;

    top:-7px;
    left:22px;

    width:85px;
    height:85px;

    border-radius:50%;

    background:#0c0014;
}

    border-radius:50%;

    filter:blur(55px);

    opacity:.25;
}
